<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QCM PHP - Chargement depuis JSON</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0b2b3b;
            --primary-light: #1f6e8c;
            --bg-light: #eef5fa;
            --card-white: #ffffff;
            --sidebar-dark: #0a2a36;
            --text-sidebar: #deedf5;
            --success: #117f4a;
            --danger: #bc3f2e;
        }
        body { background: var(--bg-light); font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }

        /* SIDEBAR */
        #mobileSidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background: var(--sidebar-dark); color: var(--text-sidebar); z-index: 1100;
            transform: translateX(-100%); transition: transform 0.25s ease;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        #mobileSidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 1.5rem 1.2rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h4 { font-weight: 800; font-size: 1.4rem; color: white; }
        .search-cat { padding: 0.8rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .search-input-side { background: #1f4b5e; border: none; border-radius: 40px; padding: 8px 16px; width: 100%; color: white; }
        .cat-list-scroll { flex: 1; padding: 0.5rem 0; }
        .cat-item-side { display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 1.2rem; margin: 4px 10px; border-radius: 14px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .cat-item-side:hover { background: rgba(255,255,255,0.08); }
        .cat-item-side.active { background: var(--primary-light); color: white; }
        .cat-badge-side { background: rgba(255,255,255,0.2); border-radius: 30px; padding: 2px 8px; font-size: 0.7rem; }

        .main-content { min-height: 100vh; padding: 1rem; transition: all 0.2s; }
        @media (min-width: 768px) {
            .main-content { margin-left: 280px; padding: 1.5rem 2rem; }
            #mobileSidebar { transform: translateX(0); }
            .menu-icon-mobile { display: none; }
        }
        .menu-icon-mobile { background: white; border: none; border-radius: 50%; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 767px) { .menu-icon-mobile { display: inline-flex; } }

        .top-toolbar {
            position: sticky; top: 0; z-index: 1050; background: rgba(238,245,250,0.96); backdrop-filter: blur(8px);
            border-radius: 28px; padding: 0.65rem 1rem; margin-bottom: 1.5rem;
            display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
        }
        .progress-wrapper { flex: 1; min-width: 100px; }
        .progress-custom { height: 8px; background: #cfdfed; border-radius: 12px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, var(--primary), var(--primary-light)); width: 0%; height: 100%; transition: width 0.3s; }
        .score-chip { background: white; border-radius: 60px; padding: 5px 15px; font-weight: 700; font-size: 0.8rem; }
        .mode-group { background: #e9f0f5; border-radius: 60px; padding: 4px; display: flex; gap: 4px; }
        .mode-btn { border: none; background: transparent; padding: 5px 12px; border-radius: 30px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
        .mode-btn.active { background: var(--primary); color: white; }

        .question-card { background: var(--card-white); border-radius: 28px; padding: 1.5rem; margin-bottom: 1.2rem; border: 1px solid #e3edf5; }
        .cat-pill { font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: 30px; display: inline-flex; align-items: center; gap: 6px; }
        .option-item { display: flex; align-items: center; gap: 12px; padding: 0.7rem 1rem; background: #fafdff; border: 1.5px solid #e2eef9; border-radius: 20px; margin-bottom: 0.6rem; cursor: pointer; transition: all 0.12s; }
        .option-item:hover:not(.disabled-opt) { background: #eef4fc; border-color: #8db3cc; }
        .opt-letter { width: 32px; height: 32px; background: #eef2f8; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; }
        .option-correct { background: #e0f5ea; border-color: var(--success); }
        .option-wrong { background: #ffe8e5; border-color: var(--danger); }
        .explanation-text { background: #fdf7ea; border-left: 6px solid #e67e22; border-radius: 16px; padding: 0.8rem 1rem; margin-top: 1rem; font-size: 0.85rem; display: none; }
        .explanation-text.show { display: block; }

        .pagination-bar {
            background: white; border-radius: 60px; padding: 0.6rem 1rem; margin-top: 1.5rem;
            display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .page-btn { background: #f0f4f9; border: none; border-radius: 40px; padding: 6px 14px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
        .page-btn.active-page { background: var(--primary); color: white; }
        .page-nav-btn { background: white; border: 1px solid #cbdbe0; border-radius: 40px; padding: 6px 16px; font-size: 0.8rem; cursor: pointer; }
        .page-nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-pagination { font-size: 0.75rem; color: #5a6874; }
        .loading { text-align: center; padding: 3rem; }
        .error-zone { background: #fff3cd; border-radius: 20px; padding: 2rem; text-align: center; }
    </style>
</head>
<body>

<aside id="mobileSidebar">
    <div class="sidebar-header">
        <h4><i class="bi bi-database-fill-gear"></i> QCM PHP</h4>
        <small>Chargement depuis JSON</small>
    </div>
    <div class="search-cat">
        <input type="text" id="filterCatInput" class="search-input-side" placeholder="🔍 Rechercher catégorie..." oninput="filterSidebarCategories()">
    </div>
    <div class="cat-list-scroll" id="sidebarCatList"></div>
    <div class="p-3 text-center opacity-50 small border-top border-light mt-2">
        <i class="bi bi-code-slash"></i> Fichier: qcm_php.json
    </div>
</aside>

<div class="main-content">
    <div class="top-toolbar">
        <button class="menu-icon-mobile" id="openSidebarBtn" onclick="toggleMobileSidebar()">
            <i class="bi bi-list"></i>
        </button>
        <div class="fw-semibold" id="currentCatTitle">📚 Toutes les catégories</div>
        <div class="progress-wrapper">
            <div class="progress-custom"><div class="progress-fill" id="globalProgressFill"></div></div>
        </div>
        <div class="score-chip" id="scoreHeader">0 / 0</div>
        <div class="mode-group">
            <button class="mode-btn active" data-mode="all" onclick="setDisplayMode('all')">📘 Tout</button>
            <button class="mode-btn" data-mode="wrong" onclick="setDisplayMode('wrong')">❌ Erreurs <span id="wrongCountSpan">0</span></button>
            <button class="mode-btn" data-mode="unseen" onclick="setDisplayMode('unseen')">👁️ Non vues</button>
        </div>
        <button class="btn btn-outline-danger btn-sm" onclick="resetAll()"><i class="bi bi-arrow-repeat"></i> Reset</button>
    </div>

    <div id="questionsContainer">
        <div class="loading">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p>Chargement des questions depuis qcm_php.json...</p>
        </div>
    </div>
    <div id="paginationContainer"></div>
    <div class="footer-note" style="text-align: center; font-size: 0.7rem; margin-top: 2rem; opacity: 0.6;">
        📊 Questions chargées dynamiquement depuis le fichier JSON
    </div>
</div>

<script>
    // État global
    let fullQuestions = [];
    let userAnswers = [];
    let currentMode = 'all';
    let currentCategory = 'Toutes';
    let currentPage = 1;
    const ITEMS_PER_PAGE = 10;
    let isLoading = true;
    
    // Chargement du fichier JSON
    async function loadQuestions() {
        try {
            const response = await fetch('./qcm_php.json');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - Fichier non trouvé`);
            }
            const data = await response.json();
            
            if (Array.isArray(data) && data.length > 0) {
                fullQuestions = data.map((q, idx) => ({ ...q, id: idx }));
                console.log(`✅ ${fullQuestions.length} questions chargées depuis qcm_php.json`);
            } else {
                throw new Error('Le fichier JSON est vide ou mal formaté');
            }
        } catch (error) {
            console.error('Erreur de chargement:', error);
            document.getElementById('questionsContainer').innerHTML = `
                <div class="error-zone">
                    <i class="bi bi-exclamation-triangle-fill fs-1 text-warning"></i>
                    <h3 class="mt-3">Fichier JSON non trouvé</h3>
                    <p>Assurez-vous que le fichier <strong>qcm_php.json</strong> est présent dans le même dossier que cette page.</p>
                    <hr>
                    <p class="text-muted small">Format attendu : tableau d'objets avec les propriétés :<br>
                    cat, q, opts (tableau), ans (index 0-3), exp</p>
                </div>
            `;
            isLoading = false;
            return;
        }
        
        userAnswers = new Array(fullQuestions.length).fill(null);
        isLoading = false;
        renderSidebar();
        render();
    }
    
    function getFilteredQuestions() {
        let filtered = fullQuestions.map((q, idx) => ({ ...q, originalIdx: idx }));
        if (currentCategory !== 'Toutes') {
            filtered = filtered.filter(q => q.cat === currentCategory);
        }
        if (currentMode === 'wrong') {
            filtered = filtered.filter(q => userAnswers[q.originalIdx] !== null && userAnswers[q.originalIdx] !== q.ans);
        }
        if (currentMode === 'unseen') {
            filtered = filtered.filter(q => userAnswers[q.originalIdx] === null);
        }
        return filtered;
    }
    
    function render() {
        if (isLoading) return;
        
        const filtered = getFilteredQuestions();
        const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
        
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);
        
        // Mise à jour des stats
        const totalAnswered = userAnswers.filter(a => a !== null).length;
        const totalCorrect = userAnswers.filter((a,i) => a !== null && a === fullQuestions[i]?.ans).length;
        const wrongCount = totalAnswered - totalCorrect;
        
        document.getElementById('globalProgressFill').style.width = (totalAnswered / fullQuestions.length * 100) + '%';
        document.getElementById('scoreHeader').innerHTML = `${totalCorrect} / ${totalAnswered}`;
        document.getElementById('wrongCountSpan').innerHTML = wrongCount;
        
        // Rendu des questions
        const container = document.getElementById('questionsContainer');
        if (paginated.length === 0) {
            container.innerHTML = `<div class="empty-zone text-center p-5 bg-white rounded-4"><i class="bi bi-inbox fs-1"></i><h5 class="mt-3">Aucune question</h5><p>Changez de filtre ou catégorie</p></div>`;
            document.getElementById('paginationContainer').innerHTML = '';
            return;
        }
        
        const colorMap = {
            "Bases PHP": "primary", "Cookies": "warning", "Sessions": "success",
            "Fichiers Texte": "info", "BD / PDO": "danger", "File Upload": "secondary"
        };
        
        let html = '';
        for (let q of paginated) {
            const isAnswered = userAnswers[q.originalIdx] !== null;
            const userChoice = userAnswers[q.originalIdx];
            const catColor = colorMap[q.cat] || "secondary";
            
            html += `<div class="question-card">
                <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                    <span class="cat-pill bg-${catColor} bg-opacity-10 text-${catColor}">
                        <i class="bi bi-tag"></i> ${q.cat}
                    </span>
                    ${isAnswered ? (userChoice === q.ans ? '<span class="badge bg-success">✓ Correct</span>' : '<span class="badge bg-danger">✗ Faux</span>') : '<span class="badge bg-secondary">À répondre</span>'}
                </div>
                <div class="fw-semibold fs-6 mb-3">${escapeHtml(q.q)}</div>
                <div>`;
            
            for (let oi = 0; oi < q.opts.length; oi++) {
                let extraClass = '';
                if (isAnswered) {
                    if (oi === q.ans) extraClass = 'option-correct';
                    if (oi === userChoice && userChoice !== q.ans) extraClass = 'option-wrong';
                }
                const letter = String.fromCharCode(65 + oi);
                html += `<div class="option-item ${extraClass} ${isAnswered ? 'disabled-opt' : ''}" onclick="${!isAnswered ? `answer(${q.originalIdx}, ${oi})` : ''}">
                    <div class="opt-letter">${letter}</div>
                    <div>${escapeHtml(q.opts[oi])}</div>
                </div>`;
            }
            
            html += `</div><div class="explanation-text ${isAnswered ? 'show' : ''}"><i class="bi bi-lightbulb text-warning me-1"></i> ${escapeHtml(q.exp)}</div></div>`;
        }
        container.innerHTML = html;
        
        // Pagination
        let pagHtml = `<div class="pagination-bar">
            <button class="page-nav-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>◀ Précédent</button>`;
        
        const maxVisible = 7;
        for (let p = 1; p <= Math.min(totalPages, maxVisible); p++) {
            pagHtml += `<button class="page-btn ${p === currentPage ? 'active-page' : ''}" onclick="goToPage(${p})">${p}</button>`;
        }
        if (totalPages > maxVisible) pagHtml += `<span class="info-pagination">...</span>`;
        
        pagHtml += `<span class="info-pagination">Page ${currentPage} / ${totalPages} (${filtered.length} questions)</span>
            <button class="page-nav-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Suivant ▶</button>
        </div>`;
        document.getElementById('paginationContainer').innerHTML = pagHtml;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function answer(globalIdx, optIdx) {
        if (userAnswers[globalIdx] !== null) return;
        userAnswers[globalIdx] = optIdx;
        render();
        renderSidebar();
    }
    
    function changePage(delta) {
        const filtered = getFilteredQuestions();
        const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
        let newPage = currentPage + delta;
        if (newPage < 1) newPage = 1;
        if (newPage > totalPages) newPage = totalPages;
        if (newPage !== currentPage) {
            currentPage = newPage;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function goToPage(page) {
        currentPage = page;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function setDisplayMode(mode) {
        currentMode = mode;
        currentPage = 1;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'all') document.querySelector('[data-mode="all"]').classList.add('active');
        if (mode === 'wrong') document.querySelector('[data-mode="wrong"]').classList.add('active');
        if (mode === 'unseen') document.querySelector('[data-mode="unseen"]').classList.add('active');
        render();
        renderSidebar();
    }
    
    function resetAll() {
        if (confirm('Réinitialiser toutes les réponses ? Cette action est définitive.')) {
            userAnswers.fill(null);
            render();
            renderSidebar();
        }
    }
    
    function renderSidebar() {
        if (fullQuestions.length === 0) return;
        const catSet = new Set(fullQuestions.map(q => q.cat));
        const cats = ['Toutes', ...Array.from(catSet).sort()];
        const container = document.getElementById('sidebarCatList');
        container.innerHTML = '';
        
        for (let cat of cats) {
            const total = cat === 'Toutes' ? fullQuestions.length : fullQuestions.filter(q => q.cat === cat).length;
            const done = cat === 'Toutes' ? userAnswers.filter(a => a !== null).length : fullQuestions.filter((_,i) => fullQuestions[i].cat === cat && userAnswers[i] !== null).length;
            const active = currentCategory === cat ? 'active' : '';
            container.innerHTML += `<div class="cat-item-side ${active}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">
                <span><i class="bi bi-folder2-open me-1"></i> ${cat}</span>
                <span class="cat-badge-side">${done}/${total}</span>
            </div>`;
        }
    }
    
    function selectCategory(cat) {
        currentCategory = cat;
        currentPage = 1;
        document.getElementById('currentCatTitle').innerHTML = cat === 'Toutes' ? '📚 Toutes les catégories' : `📁 ${cat}`;
        renderSidebar();
        render();
        if (window.innerWidth < 768) toggleMobileSidebar();
    }
    
    function filterSidebarCategories() {
        const search = document.getElementById('filterCatInput').value.toLowerCase();
        document.querySelectorAll('.cat-item-side').forEach(item => {
            const txt = item.innerText.toLowerCase();
            item.style.display = txt.includes(search) ? 'flex' : 'none';
        });
    }
    
    function toggleMobileSidebar() {
        document.getElementById('mobileSidebar').classList.toggle('open');
    }
    
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('mobileSidebar');
        const btn = document.getElementById('openSidebarBtn');
        if (window.innerWidth < 768 && sidebar?.classList.contains('open')) {
            if (!sidebar.contains(e.target) && !btn?.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        }
    });
    
    // Démarrage
    loadQuestions();
</script>
</body>
</html>
